services:
  - type: web
    name: jobmatch-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pnpm install && pnpm run build
    startCommand: node dist/src/db/migrate.js && node dist/src/db/seed.js && node dist/src/server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://job-match-ai-frontend.vercel.app
      - key: ASGARDEO_JWKS_URL
        value: https://api.asgardeo.io/t/orgsacma/oauth2/jwks
      - key: ASGARDEO_ISSUER
        value: https://api.asgardeo.io/t/orgsacma/oauth2/token
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: jobmatch-redis
          property: connectionString

  - type: redis
    name: jobmatch-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
